# Netlify deployment config for ParityProven
# The published site is web/ (HTML/CSS/JS) and receipts/ (committed receipt JSON), nothing else.
# receipts/ is rebuilt locally with npm run receipts:build and committed.

[build]
  # Copy web/ and receipts/ into _site/ and publish only that (scripts/build-site.mjs, no dependencies).
  # Publishing the repository root served every repository file (seen 2026-11-17/18: /src/cli/convert.ts, /package.json
  # returned 200; .netlifyignore is honoured only by CLI deploys, not by the git-linked build).
  # receipts:build is NOT run here: it needs inventory/*.json, generated from the restored databases and not committed,
  # and full git history (Netlify clones shallow). This command overrides the dashboard's `npm run build:ci`.
  command = "node scripts/build-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Rewrites: serve web/ pages at clean URLs
[[redirects]]
  from = "/"
  to   = "/web/index.html"
  status = 200

[[redirects]]
  from = "/receipt"
  to   = "/web/receipt.html"
  status = 200
  query = {db = ":db", obj = ":obj"}

[[redirects]]
  from = "/receipt"
  to   = "/web/receipt.html"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to   = "/web/favicon.svg"
  status = 200
[[redirects]]
  from = "/about"
  to   = "/web/about.html"
  status = 200
[[redirects]]
  from = "/access-map"
  to   = "/web/access-map.html"
  status = 200
[[redirects]]
  from = "/questionnaire"
  to   = "/web/questionnaire.html"
  status = 200

# Cache receipts JSON — short TTL so new builds propagate quickly
[[headers]]
  for = "/receipts/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

[[headers]]
  for = "/web/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=300"
