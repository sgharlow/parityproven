services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -No -Q "SELECT 1" > /dev/null
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  postgres:
    # postgis/postgis is the official PostGIS build of postgres:18 (PostGIS 3.6). Added 2026-11-09 so SQL Server
    # geography columns have a PostgreSQL equivalent. Image digest recorded in sources/manifest.json.
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_PASSWORD: "${PG_PASSWORD}"
      POSTGRES_DB: parityproven
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parityproven"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d
